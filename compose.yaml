services:
  web:
    build: .
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html

  database:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: portfolio
      MYSQL_USER: portfolio
      MYSQL_PASSWORD: portfolio123
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:

